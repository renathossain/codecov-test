# GitHub Actions workflow for testing Python projects with pytest
# Runs tests on Python 3.10, 3.11, and 3.12, caches pip dependencies, and uploads coverage to Codecov

name: Upload Coverage to Codecov

# Trigger workflow on push and pull request events to main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Test job matrix across Python versions
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
          pip install pytest pytest-cov

      - name: Run tests and collect coverage
        run: pytest --cov=./ --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
